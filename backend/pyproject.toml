[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot-api"
version = "0.1.0"
description = "AI-assisted job search and application workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "python-multipart",
  "psycopg[binary]",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pgvector",
  "redis",
  "celery",
  "langgraph",
  "langchain",
  "langchain-openai",
  "playwright",
  "langsmith",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
